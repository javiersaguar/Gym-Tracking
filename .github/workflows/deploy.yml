name: Desplegar en GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Un único despliegue a la vez; las ejecuciones en cola se descartan salvo la
# última, que es la que refleja el estado real de la rama.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Pages sirve la app desde /<repo>/, no desde la raíz: el mismo valor lo
      # usan Vite para las rutas de los assets y el service worker para saber
      # qué precachear.
      - name: Construir
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
